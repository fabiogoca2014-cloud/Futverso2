<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Futverso 3D</title><style>body{margin:0;overflow:hidden;background:#162c25;font-family:Arial;color:white}#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#102627d9;padding:12px 20px;border-radius:14px;font-size:22px;font-weight:bold}#touch{position:fixed;bottom:25px;width:100%;display:flex;justify-content:space-between;padding:0 20px;box-sizing:border-box}button{border:0;border-radius:50%;background:#2376cd;color:white;font-weight:bold;padding:20px;touch-action:none}#shoot{background:#e65b26}#joy{width:110px;height:110px;background:#ffffff33;border:2px solid #fff6;border-radius:50%;touch-action:none;position:relative}#stick{width:38px;height:38px;border-radius:50%;background:#fffc;position:absolute;top:36px;left:36px}#intro{position:fixed;top:35%;left:10%;width:80%;text-align:center;background:#132e30ed;border-radius:20px;padding:20px;box-sizing:border-box}#intro button{border-radius:14px;background:#2da35f}</style><div id="hud">AZUL <span id="score">0 × 0</span> VERMELHO · <span id="time">02:00</span></div><div id="touch"><div id="joy"><div id="stick"></div></div><div><button id="change">TROCAR</button><button id="pass">PASSE</button><button id="shoot">CHUTE</button></div></div><div id="intro"><h1>⚽ FUTVERSO 3D</h1><p>Futebol 3D • Joystick no celular • WASD no teclado</p><button id="start">JOGAR</button></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';const sc=new T.Scene();sc.background=new T.Color('#74bfe6');const cam=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,200),rd=new T.WebGLRenderer({antialias:true});rd.setSize(innerWidth,innerHeight);document.body.prepend(rd.domElement);sc.add(new T.HemisphereLight(0xffffff,0x456040,2));const dl=new T.DirectionalLight(0xffffff,2);dl.position.set(-25,55,20);sc.add(dl);const material=c=>new T.MeshStandardMaterial({color:c});function mesh(g,m,x,y,z){let o=new T.Mesh(g,material(m));o.position.set(x,y,z);sc.add(o);return o}let grass=mesh(new T.BoxGeometry(90,.1,58),'#287f4c',0,-.1,0);for(let i=0;i<9;i++)mesh(new T.BoxGeometry(10,.02,58),i%2?'#2a8950':'#309657',-40+i*10,0,0);function line(a,b){let pts=[new T.Vector3(a[0],.05,a[1]),new T.Vector3(b[0],.05,b[1])];sc.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:'white'})))}function rect(x1,z1,x2,z2){line([x1,z1],[x2,z1]);line([x2,z1],[x2,z2]);line([x2,z2],[x1,z2]);line([x1,z2],[x1,z1])}rect(-45,-29,45,29);line([0,-29],[0,29]);rect(-45,-16,-30,16);rect(30,-16,45,16);let c=[];for(let i=0;i<=60;i++)c.push(new T.Vector3(Math.cos(i*Math.PI/30)*9,.05,Math.sin(i*Math.PI/30)*9));sc.add(new T.Line(new T.BufferGeometry().setFromPoints(c),new T.LineBasicMaterial({color:'white'})));for(let s of [-1,1]){for(let z of [-8,8])mesh(new T.BoxGeometry(.25,3,.25),'white',s*45,1.5,z);mesh(new T.BoxGeometry(.25,.2,16.2),'white',s*45,3,0)}function make(x,z,team){let g=new T.Group(),color=team===0?'#168cde':'#df4136';let body=new T.Mesh(new T.CylinderGeometry(.65,.55,1.5,10),material(color));body.position.y=1.5;g.add(body);let head=new T.Mesh(new T.SphereGeometry(.41,12,8),material('#b7896d'));head.position.y=2.55;g.add(head);for(let v of [-1,1]){let leg=new T.Mesh(new T.CylinderGeometry(.19,.19,.95,8),material('#222c37'));leg.position.set(v*.3,.5,0);g.add(leg)}sc.add(g);g.position.set(x,0,z);return{x,z,team,g,delay:0}}let ps=[];for(let t=0;t<2;t++){let s=t?-1:1;for(let [x,z] of [[-36,0],[-23,-13],[-23,13],[-12,0],[-6,-18],[-6,18]])ps.push(make(x*s,z,t))}let hero=ps[3],bx=0,bz=0,vx=0,vz=0,points=[0,0],sec=120,running=false,keys={},joy={x:0,z:0};let stamina=1;let ball=mesh(new T.SphereGeometry(.5,16,12),'white',0,.5,0);let ring=mesh(new T.TorusGeometry(1,.12,6,32),'#ffff00',0,.1,0);ring.rotation.x=Math.PI/2;function fire(pass){if(Math.hypot(bx-hero.x,bz-hero.z)>3)return;let mates=ps.filter(p=>p.team===0&&p!==hero&&p.x>hero.x-3).sort((a,b)=>Math.hypot(a.x-hero.x,a.z-hero.z)-Math.hypot(b.x-hero.x,b.z-hero.z));let tx=pass&&mates.length?mates[0].x+1:47,tz=pass&&mates.length?mates[0].z:-hero.z*.4;let d=Math.hypot(tx-bx,tz-bz);vx=(tx-bx)/d*(pass?22:31);vz=(tz-bz)/d*(pass?22:31)}function swap(){hero=ps.filter(p=>p.team===0).sort((a,b)=>Math.hypot(a.x-bx,a.z-bz)-Math.hypot(b.x-bx,b.z-bz))[0]}document.querySelector('#shoot').onclick=()=>fire(false);document.querySelector('#pass').onclick=()=>fire(true);document.querySelector('#change').onclick=swap;document.querySelector('#start').onclick=()=>{running=true;document.querySelector('#intro').style.display='none'};onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')fire(false);if(e.key.toLowerCase()==='x')fire(true);if(e.key.toLowerCase()==='c')swap()};onkeyup=e=>keys[e.key.toLowerCase()]=false;let pad=document.querySelector('#joy'),stick=document.querySelector('#stick');function move(e){let r=pad.getBoundingClientRect(),x=e.clientX-r.left-55,z=e.clientY-r.top-55,d=Math.max(1,Math.hypot(x,z)),f=Math.min(1,d/40);joy.x=x/d*f;joy.z=z/d*f;stick.style.transform='translate('+joy.x*35+'px,'+joy.z*35+'px)'}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))move(e)};pad.onpointerup=()=>{joy.x=joy.z=0;stick.style.transform=''};function reset(){bx=bz=vx=vz=0}let old=performance.now();function frame(n){requestAnimationFrame(frame);let dt=Math.min(.04,(n-old)/1000);old=n;if(running){sec=Math.max(0,sec-dt);document.querySelector('#time').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(Math.floor(sec%60)).padStart(2,'0');let dx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=joy.z+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),d=Math.max(1,Math.hypot(dx,dz));let sprint=keys.shift?1.45:1;hero.x+=dx/d*12*sprint*dt;hero.z+=dz/d*12*sprint*dt;for(let p of ps){if(p!==hero){let target=p.team?[bx,bz]:[Math.max(-35,Math.min(35,bx-8)),p.z],v=Math.hypot(target[0]-p.x,target[1]-p.z);if(v>.3){p.x+=(target[0]-p.x)/v*dt*(p.team?7:3);p.z+=(target[1]-p.z)/v*dt*(p.team?7:3)}}p.x=Math.max(-43,Math.min(43,p.x));p.z=Math.max(-27,Math.min(27,p.z));p.g.position.set(p.x,0,p.z);p.delay=Math.max(0,p.delay-dt);if(Math.hypot(p.x-bx,p.z-bz)<1.5&&p.delay<=0){if(p.team===1){let dist=Math.hypot(p.x-bx,p.z-bz);if(dist<1.5){vx=-19;vz=(0-bz)*.25;p.delay=1}}else if(p===hero&&Math.hypot(vx,vz)<9){bx=p.x+1;bz=p.z;vx=dx*3;vz=dz*3}}}bx+=vx*dt;bz+=vz*dt;vx*=Math.exp(-1.6*dt);vz*=Math.exp(-1.6*dt);if(Math.abs(bz)>28){bz=Math.sign(bz)*28;vz=-vz*.6}if(Math.abs(bx)>45){if(Math.abs(bz)<8){points[bx>0?0:1]++;document.querySelector('#score').textContent=points.join(' × ');reset()}else{bx=Math.sign(bx)*44.7;vx=-vx*.5}}if(!sec){running=false;document.querySelector('#intro').style.display='block';document.querySelector('#intro h1').textContent='FIM DE JOGO';document.querySelector('#start').textContent='RECOMEÇAR';document.querySelector('#start').onclick=()=>location.reload()}}ball.position.set(bx,.5,bz);ring.position.x=hero.x;ring.position.z=hero.z;cam.position.lerp(new T.Vector3(Math.max(-16,Math.min(16,bx*.28)),48,62+Math.max(-8,Math.min(8,bz*.18))),.035);cam.lookAt(bx*.35,0,bz*.3);rd.render(sc,cam)}requestAnimationFrame(frame);onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rd.setSize(innerWidth,innerHeight)}</script></html>
