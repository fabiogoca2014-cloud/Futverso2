<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111d"><title>Futverso V2</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section id="home" class="screen active"><div class="hero"><div class="ball">⚽</div><h1>FUTVERSO</h1><span class="badge">V2</span><p>Seu universo. Seu clube. Sua história.</p></div><div class="menu"><button onclick="newCareer()">NOVA CARREIRA</button><button onclick="continueGame()">CONTINUAR</button><button class="secondary" onclick="show('about')">SOBRE O JOGO</button></div><footer>FUTVERSO V2 • Football Manager</footer></section>
<section id="career" class="screen"><button class="back" onclick="show('home')">← Voltar</button><h2>Escolha a divisão</h2><div id="leagues" class="grid"></div><h2>Escolha seu clube</h2><div id="clubs" class="clubs"></div></section>
<section id="dashboard" class="screen"><header><div><small>FUTVERSO V2</small><h2 id="clubName"></h2><span id="division"></span></div><button class="mini" onclick="show('home')">☰</button></header><div class="stats"><article><small>💰 Caixa</small><strong id="money"></strong></article><article><small>🏆 Posição</small><strong id="position"></strong></article><article><small>⭐ Moral</small><strong id="morale"></strong></article></div>
<article class="match"><small id="roundLabel"></small><h3><span id="myClub"></span> <b>×</b> <span id="opponent"></span></h3><button onclick="playMatch()">SIMULAR PARTIDA</button><div id="result"></div></article>
<div class="actions"><button onclick="openSquad()">👥 Elenco</button><button onclick="openMarket()">🔄 Transferências</button><button onclick="openCalendar()">📅 Calendário</button><button onclick="openTable()">📊 Tabela</button></div><article class="news"><h3>📰 Central do clube</h3><div id="news"></div></article></section>
<section id="panel" class="screen"><button class="back" onclick="dashboard(load())">← Voltar</button><h2 id="panelTitle"></h2><div id="panelBody"></div></section>
<section id="about" class="screen"><button class="back" onclick="show('home')">← Voltar</button><h2>Futverso V2</h2><p>Carreira com temporada, elenco, mercado, calendário, classificação e evolução do clube.</p></section>
</main><script src="game.js"></script></body></html>
